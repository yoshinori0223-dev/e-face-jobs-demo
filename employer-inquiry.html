<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求人掲載のお問い合わせ | E-FACE JOBS</title><link rel="stylesheet" href="style.css?v=20261002-34"></head><body><header class="main-header"><a class="brand-link" href="index.html"><img src="eface_header_logo_candidate1.png" alt="E-FACE JOBS"></a><nav class="main-nav"><a href="jobs.html">求人を探す</a><a href="features.html">お仕事特集</a><a href="guide.html">はじめての方へ</a><a href="employers.html">企業のご担当者様へ</a><a href="company.html">運営会社</a></nav><div class="header-actions"><button class="mypage-btn" onclick="location.href='login.html'">ログイン</button><button class="register-btn" onclick="location.href='register.html'">新規登録（無料）</button></div></header><main class="demo-page apply-page"><section class="page-hero"><small>FOR EMPLOYERS</small><h1>求人掲載のお問い合わせ</h1><p>採用についてのお困りごとをご相談ください。</p></section><div class="apply-steps"><b class="on" id="s1">1 入力</b><b id="s2">2 確認</b><b id="s3">3 完了</b></div><section class="demo-card application-card" id="formPane"><form id="inqForm"><label>会社名 <em>必須</em><input id="company" required placeholder="例）株式会社○○"></label><label>ご担当者名 <em>必須</em><input id="person" required placeholder="例）山田 太郎"></label><label>メールアドレス <em>必須</em><input id="email" type="email" required placeholder="example@company.jp"></label><label>電話番号 <em>必須</em><input id="tel" type="tel" required placeholder="092-000-0000"></label><label>採用予定職種<input id="job" placeholder="例）コールセンタースタッフ"></label><label>採用予定人数<select id="num"><option>未定</option><option>1名</option><option>2〜5名</option><option>6〜10名</option><option>11名以上</option></select></label><label>ご相談内容<textarea id="msg" rows="5" placeholder="募集状況やお困りごとをご記入ください"></textarea></label><label class="agree"><input type="checkbox" required><span><a href="privacy.html" target="_blank">個人情報保護方針</a>に同意する</span></label><button class="primary-wide">入力内容を確認する</button></form></section><section class="demo-card application-card hide" id="confirmPane"><h2>お問い合わせ内容の確認</h2><div id="confirmData" class="confirm-data"></div><div class="form-actions"><button class="secondary-btn" id="backBtn">修正する</button><button class="primary-btn" id="sendBtn">この内容で送信</button></div><p class="demo-warning">デモのため実際には送信されません。</p></section><section class="demo-card application-card complete hide" id="completePane"><div class="complete-mark">✓</div><h2>お問い合わせを受け付けました</h2><p>本番ではE-FACE担当者へ通知される想定です。</p><p class="demo-warning">現在はデモのため、実際の送信は行われていません。</p><a href="index.html">TOPへ戻る</a></section></main><footer><div class="footer-links"><a href="company.html">運営会社</a><a href="privacy.html">個人情報保護方針</a><a href="terms.html">利用規約</a><a href="guide.html">はじめての方へ</a><a href="employers.html">企業のご担当者様へ</a><a href="login.html">ログイン</a><a href="admin-demo.html">採用管理画面（デモ）</a></div><b>E-FACE JOBS</b><br><small>掲載内容はすべてデモ用の架空情報です。</small></footer><script>
const esc=x=>String(x||'未入力').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));inqForm.onsubmit=e=>{e.preventDefault();const v=[['会社名',company.value],['ご担当者名',person.value],['メール',email.value],['電話番号',tel.value],['採用予定職種',job.value],['採用予定人数',num.value],['ご相談内容',msg.value]];confirmData.innerHTML=v.map(x=>'<div><b>'+x[0]+'</b><span>'+esc(x[1])+'</span></div>').join('');formPane.classList.add('hide');confirmPane.classList.remove('hide');s1.classList.remove('on');s2.classList.add('on')};backBtn.onclick=()=>{confirmPane.classList.add('hide');formPane.classList.remove('hide');s2.classList.remove('on');s1.classList.add('on')};sendBtn.onclick=()=>{confirmPane.classList.add('hide');completePane.classList.remove('hide');s2.classList.remove('on');s3.classList.add('on')};</script></body></html>
