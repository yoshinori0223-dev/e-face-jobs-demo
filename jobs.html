<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求人を探す | E-FACE JOBS</title><link rel="stylesheet" href="style.css?v=20261002-34"></head><body>
<header class="main-header"><a class="brand-link" href="index.html"><img src="eface_header_logo_candidate1.png" alt="E-FACE JOBS"></a><nav class="main-nav"><a href="jobs.html">求人を探す</a><a href="features.html">お仕事特集</a><a href="guide.html">はじめての方へ</a><a href="employers.html">企業のご担当者様へ</a><a href="company.html">運営会社</a></nav><div class="header-actions"><button class="mypage-btn" onclick="location.href='login.html'">ログイン</button><button class="register-btn" onclick="location.href='register.html'">新規登録（無料）</button></div></header>
<main class="demo-page"><section class="page-hero"><small>SEARCH JOBS</small><h1>求人を探す</h1><p>勤務地・職種・雇用形態・給与・こだわり条件から検索できます。</p></section><section class="demo-card search-panel"><div class="advanced-search"><label>キーワード<input id="jq" placeholder="職種・会社名・条件"></label><label>勤務地<input id="jplace" placeholder="例）福岡市"></label><label>職種<select id="jcat"><option value="">指定なし</option></select></label><label>雇用形態<select id="jtype"><option value="">指定なし</option><option>正社員</option><option>契約社員</option><option>派遣社員</option><option>アルバイト・パート</option></select></label><label>給与<select id="jpay"><option value="">指定なし</option><option value="1300">時給1,300円以上</option><option value="1400">時給1,400円以上</option><option value="1500">時給1,500円以上</option></select></label><label>こだわり<select id="jtag"><option value="">指定なし</option><option>未経験</option><option>土日祝休み</option><option>週3日</option><option>車通勤</option></select></label></div><div class="search-actions"><button id="clearBtn" class="secondary-btn">条件をクリア</button><button id="searchBtn" class="primary-btn">🔍 この条件で検索</button></div></section><section><div class="heading"><div><h2>検索結果</h2><small id="jcount"></small></div></div><div id="jobResults" class="search-results"></div></section></main>
<footer><div class="footer-links"><a href="company.html">運営会社</a><a href="privacy.html">個人情報保護方針</a><a href="terms.html">利用規約</a><a href="guide.html">はじめての方へ</a><a href="employers.html">企業のご担当者様へ</a></div><b>E-FACE JOBS</b><br><small>掲載内容はすべてデモ用の架空情報です。</small></footer><script src="jobs.js"></script><script>
const cats=[...new Set(JOBS.map(x=>x.cat))];cats.forEach(c=>jcat.add(new Option(c,c)));const esc=x=>String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function hourly(pay){let m=pay.match(/時給\s*([\d,]+)/);return m?+m[1].replace(',',''):0}function draw(){let q=jq.value.toLowerCase(),p=jplace.value.toLowerCase(),a=JOBS.filter(j=>(!q||[j.title,j.company,j.cat,...j.tags].join(' ').toLowerCase().includes(q))&&(!p||j.area.toLowerCase().includes(p))&&(!jcat.value||j.cat===jcat.value)&&(!jtype.value||j.type===jtype.value)&&(!jpay.value||hourly(j.pay)>=+jpay.value)&&(!jtag.value||j.tags.join(' ').includes(jtag.value)));jcount.textContent=a.length+'件';jobResults.innerHTML=a.map(j=>'<article class="result-card"><div><span class="result-cat">'+esc(j.cat)+'</span><h3>'+esc(j.title)+'</h3><p>'+esc(j.company)+'</p><p>📍 '+esc(j.area)+'　｜　'+esc(j.type)+'</p><b>'+esc(j.pay)+'</b><div class="tags">'+j.tags.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div></div><a class="primary-link" href="job-detail.html?id='+j.id+'">求人詳細を見る</a></article>').join('')||'<div class="demo-card">該当する求人がありません。条件を変更して検索してください。</div>'}searchBtn.onclick=draw;[jq,jplace,jcat,jtype,jpay,jtag].forEach(x=>x.onchange=draw);clearBtn.onclick=()=>{[jq,jplace,jcat,jtype,jpay,jtag].forEach(x=>x.value='');draw()};draw();
</script></body></html>
