<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>応募者管理デモ | E-FACE JOBS</title><link rel="stylesheet" href="style.css?v=20261002-28"></head><body class="admin-body">
<header class="admin-header"><div class="admin-brand"><img src="eface_header_logo_candidate1.png" alt="E-FACE JOBS"><div><b>採用管理</b><small>ADMIN DEMO</small></div></div><a href="index.html">公開サイトを見る ↗</a></header>
<main class="admin-wrap"><div class="admin-title"><div><small>E-FACE JOBS / MANAGEMENT</small><h1>応募者管理</h1></div><span class="demo-badge">デモデータ</span></div>
<section class="admin-stats"><article><small>今月の応募</small><strong id="total">0</strong><span>件</span></article><article><small>未対応</small><strong id="newCount">0</strong><span>件</span></article><article><small>面接予定</small><strong id="interviewCount">0</strong><span>件</span></article><article><small>採用</small><strong id="hiredCount">0</strong><span>件</span></article></section>
<section class="admin-panel"><div class="admin-tools"><div><h2>応募者一覧</h2><small>応募状況を確認・管理できます</small></div><div class="admin-filters"><input id="aq" placeholder="氏名・求人名で検索"><select id="statusFilter"><option value="">すべてのステータス</option><option>未対応</option><option>連絡済</option><option>面接予定</option><option>採用</option><option>不採用</option></select></div></div>
<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>応募日時</th><th>応募者</th><th>応募求人</th><th>連絡先</th><th>ステータス</th><th></th></tr></thead><tbody id="applicants"></tbody></table></div></section>
<section class="admin-note">この管理画面に表示されている氏名・電話番号・メールアドレス・応募情報は、すべて架空のデモデータです。実在する個人情報は保存していません。</section></main>
<div id="adminModal" class="modal hide"><div class="box admin-detail-box"><button id="adminClose">×</button><div id="adminDetail"></div></div></div>
<script>
const DATA=[
{id:1,date:'10/02 10:18',name:'山田 太郎',kana:'やまだ たろう',job:'コールセンター受信スタッフ',company:'株式会社サンプルコミュニケーション',tel:'090-0000-1001',email:'taro.yamada@example.com',status:'未対応',message:'平日の勤務を希望しています。'},
{id:2,date:'10/02 09:42',name:'佐藤 美咲',kana:'さとう みさき',job:'一般事務・データ入力',company:'株式会社デモオフィス',tel:'090-0000-1002',email:'misaki.sato@example.com',status:'連絡済',message:'勤務開始日は相談可能です。'},
{id:3,date:'10/01 16:05',name:'中村 健',kana:'なかむら けん',job:'倉庫内軽作業スタッフ',company:'福岡デモロジ株式会社',tel:'090-0000-1003',email:'ken.nakamura@example.com',status:'面接予定',message:'未経験ですが応募可能でしょうか。'},
{id:4,date:'10/01 13:20',name:'井上 彩',kana:'いのうえ あや',job:'ショップ販売スタッフ',company:'天神サンプルストア',tel:'090-0000-1004',email:'aya.inoue@example.com',status:'採用',message:'土日勤務可能です。'},
{id:5,date:'09/30 17:35',name:'田中 翔',kana:'たなか しょう',job:'製造補助スタッフ',company:'博多デモ製作所',tel:'090-0000-1005',email:'sho.tanaka@example.com',status:'不採用',message:'夜勤について確認したいです。'},
{id:6,date:'09/30 11:10',name:'松本 奈々',kana:'まつもと なな',job:'コールセンター発信スタッフ',company:'株式会社サンプルマーケティング',tel:'090-0000-1006',email:'nana.matsumoto@example.com',status:'未対応',message:'週4日勤務を希望しています。'}
];
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function badge(s){return '<span class="status status-'+({'未対応':'new','連絡済':'contact','面接予定':'interview','採用':'hired','不採用':'rejected'}[s])+'">'+s+'</span>'}
function render(){let q=aq.value.toLowerCase(),sf=statusFilter.value,rows=DATA.filter(x=>(!q||(x.name+x.job+x.company).toLowerCase().includes(q))&&(!sf||x.status===sf));applicants.innerHTML=rows.map(x=>'<tr><td>'+x.date+'</td><td><b>'+esc(x.name)+'</b><small>'+esc(x.kana)+'</small></td><td><b>'+esc(x.job)+'</b><small>'+esc(x.company)+'</small></td><td>'+esc(x.tel)+'<small>'+esc(x.email)+'</small></td><td>'+badge(x.status)+'</td><td><button class="detail-btn" onclick="show('+x.id+')">詳細</button></td></tr>').join('')||'<tr><td colspan="6">該当する応募者はいません。</td></tr>';stats()}
function stats(){total.textContent=DATA.length;newCount.textContent=DATA.filter(x=>x.status==='未対応').length;interviewCount.textContent=DATA.filter(x=>x.status==='面接予定').length;hiredCount.textContent=DATA.filter(x=>x.status==='採用').length}
function show(id){let x=DATA.find(y=>y.id===id);adminDetail.innerHTML='<small>応募者詳細</small><h2>'+esc(x.name)+'</h2><div class="admin-detail-grid"><div><b>応募日時</b><span>'+x.date+'</span></div><div><b>応募求人</b><span>'+esc(x.job)+'</span></div><div><b>掲載企業</b><span>'+esc(x.company)+'</span></div><div><b>電話番号</b><span>'+esc(x.tel)+'</span></div><div><b>メール</b><span>'+esc(x.email)+'</span></div><div><b>メッセージ</b><span>'+esc(x.message)+'</span></div></div><label class="status-change">対応ステータス<select id="detailStatus"><option>未対応</option><option>連絡済</option><option>面接予定</option><option>採用</option><option>不採用</option></select></label><button class="primary-wide" id="saveStatus">ステータスを変更</button><p class="demo-warning">変更はこの画面上のデモデータだけに反映され、再読み込みすると元に戻ります。</p>';detailStatus.value=x.status;saveStatus.onclick=()=>{x.status=detailStatus.value;render();adminModal.classList.add('hide')};adminModal.classList.remove('hide')}
aq.oninput=render;statusFilter.onchange=render;adminClose.onclick=()=>adminModal.classList.add('hide');adminModal.onclick=e=>{if(e.target===adminModal)adminModal.classList.add('hide')};render();
</script></body></html>
