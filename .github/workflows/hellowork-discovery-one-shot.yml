name: Hello Work discovery one-shot verification
on:
  push:
    paths:
      - ".github/workflows/hellowork-discovery-one-shot.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/hellowork_discovery_test.py --max 5 --delay 4 --output data/hellowork-discovery-one-shot.json
      - uses: actions/upload-artifact@v4
        with:
          name: hellowork-discovery-one-shot
          path: data/hellowork-discovery-one-shot.json
