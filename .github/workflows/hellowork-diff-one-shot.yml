name: Hello Work diff one-shot regression
on:
  push:
    paths:
      - ".github/workflows/hellowork-diff-one-shot.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/hellowork_diff_regression_test.py
