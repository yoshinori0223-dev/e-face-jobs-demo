name: Hello Work TOP live sample
on:
  push:
    paths:
      - ".github/workflows/hellowork-top-live-sample.yml"
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/hellowork_discovery_test.py --max 3 --delay 4 --output data/top-live-sample.json
      - uses: actions/upload-artifact@v4
        with:
          name: hellowork-top-live-sample
          path: data/top-live-sample.json
