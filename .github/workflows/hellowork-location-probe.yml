name: Hello Work location modal probe
on:
  push:
    paths:
      - ".github/workflows/hellowork-location-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/hellowork_location_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: hellowork-location-modal-probe
          path: data/hellowork-location-modal-probe.json
