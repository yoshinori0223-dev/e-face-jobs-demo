name: Hello Work search POST test
on:
  push:
    paths:
      - ".github/workflows/hellowork-search-post-test.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/hellowork_search_post_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: hellowork-search-post-test
          path: data/hellowork-search-post-test.json
