name: Hello Work search form probe

on:
  push:
    paths:
      - ".github/workflows/hellowork-search-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/hellowork_search_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: hellowork-search-form-probe
          path: data/hellowork-search-form-probe.json
