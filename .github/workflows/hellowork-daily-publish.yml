name: Hello Work daily publish

on:
  schedule:
    # 09:00 JST every day (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hellowork-daily-publish.yml"
      - "tools/hellowork*.py"

concurrency:
  group: hellowork-daily-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Regression tests
        run: |
          python tools/hellowork_diff_regression_test.py
          python tools/hellowork_closure_regression_test.py
          python tools/hellowork_state_merge_regression_test.py
          python tools/hellowork_pipeline_regression_test.py
          python tools/hellowork_daily_regression_test.py

      - name: Verify bounded queue and build public display
        run: python tools/hellowork_daily.py

      - name: Commit only when data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hellowork-live-test.js data/hellowork-auto-state.json
          if git diff --cached --quiet; then
            echo "No Hello Work changes to publish"
            exit 0
          fi
          git commit -m "Daily Hello Work update"
          git push origin HEAD:main

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hellowork-daily-audit
          path: |
            data/hellowork-daily-audit.json
            data/hellowork-auto-state.json
          if-no-files-found: warn
