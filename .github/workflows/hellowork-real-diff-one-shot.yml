name: Hello Work real diff one-shot
on:
  push:
    paths:
      - ".github/workflows/hellowork-real-diff-one-shot.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: First real snapshot
        run: python tools/hellowork_discovery_test.py --max 5 --delay 3 --output data/prev.json
      - name: Second real snapshot
        run: python tools/hellowork_discovery_test.py --max 5 --delay 3 --output data/current.json
      - name: Diff snapshots
        run: python tools/hellowork_diff_test.py --current data/current.json --previous data/prev.json --output data/diff.json
      - name: Assert stable duplicate detection
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/diff.json",encoding="utf-8"))
          s=d["summary"]
          print(s)
          assert s["new"]==0, s
          assert s["changed"]==0, s
          assert s["ended_candidate"]==0, s
          assert s["active"]==5, s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hellowork-real-diff-one-shot
          path: data/diff.json
