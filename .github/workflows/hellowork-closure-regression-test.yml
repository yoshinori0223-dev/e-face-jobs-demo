name: Hello Work closure regression test
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hellowork-closure-regression-test.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/hellowork_closure_regression_test.py
