name: Hello Work diff regression test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/hellowork_diff_regression_test.py
