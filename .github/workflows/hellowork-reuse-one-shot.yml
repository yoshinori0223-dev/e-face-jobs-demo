name: Hello Work reuse-detail one-shot
on:
  push:
    paths:
      - ".github/workflows/hellowork-reuse-one-shot.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Baseline snapshot
        run: python tools/hellowork_discovery_test.py --max 5 --delay 3 --output data/prev.json
      - name: Reuse previous details
        run: python tools/hellowork_discovery_test.py --max 5 --delay 3 --previous data/prev.json --output data/current.json
      - name: Assert zero repeat detail fetches
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/current.json",encoding="utf-8"))
          print({"discovered":d["discovered"],"detail_fetches":d["detail_fetches"],"reused_existing":d["reused_existing"]})
          assert d["discovered"]==5, d
          assert d["detail_fetches"]==0, d
          assert d["reused_existing"]==5, d
          PY
