<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求人詳細 | E-FACE JOBS</title><link rel="stylesheet" href="style.css?v=20261002-29"></head><body>

<main class="job-detail-page"><a class="back-link" href="index.html">← 求人一覧へ戻る</a><section id="jdHero" class="jd-hero"></section><div class="jd-layout"><div><section class="jd-card"><h2>仕事内容</h2><p>こちらはE-FACE JOBSのデモ求人です。実際の求人では、具体的な業務内容、1日の流れ、研修内容などを詳しく掲載します。</p><h3>この仕事のポイント</h3><ul><li>未経験からスタートしやすい研修を想定</li><li>勤務条件やシフトを分かりやすく掲載</li><li>応募前に仕事内容・待遇を確認できます</li></ul></section><section class="jd-card"><h2>募集要項</h2><div id="jdSpecs" class="jd-specs"></div></section><section class="jd-card"><h2>会社情報</h2><div id="jdCompany"></div><p class="demo-warning">掲載内容はすべてデモ用の架空情報です。</p></section></div><aside class="jd-apply"><div><small>この求人に応募する</small><h3 id="sidePay"></h3><p>応募は約1〜2分で完了します。</p><button id="applyBtn" class="primary-wide">応募画面へ進む</button><button id="favBtn" class="fav-btn">☆ お気に入りに保存</button></div></aside></div></main>

const p=new URLSearchParams(location.search),id=+(p.get('id')||1),j=JOBS.find(x=>x.id===id)||JOBS[0],e=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
document.title=j.title+' | E-FACE JOBS';jdHero.innerHTML='<div class="jd-cat">'+e(j.cat)+'</div><h1>'+e(j.title)+'</h1><p class="jd-company">'+e(j.company)+'</p><div class="tags">'+j.tags.map(x=>'<span>'+e(x)+'</span>').join('')+'</div><div class="jd-mainfacts"><b>'+e(j.pay)+'</b><span>📍 '+e(j.area)+'</span><span>雇用形態：'+e(j.type)+'</span></div>';
jdSpecs.innerHTML=[['職種',j.cat],['雇用形態',j.type],['給与',j.pay],['勤務地',j.area],['勤務時間','9:00〜18:00の間で勤務（デモ）'],['休日・休暇','シフト制／勤務先カレンダーによる（デモ）'],['待遇','交通費支給・社会保険制度あり（デモ）'],['応募資格','経験不問／未経験者歓迎（デモ）']].map(x=>'<div><b>'+x[0]+'</b><span>'+e(x[1])+'</span></div>').join('');jdCompany.innerHTML='<h3>'+e(j.company)+'</h3><p>勤務地：'+e(j.area)+'</p>';sidePay.textContent=j.pay;applyBtn.onclick=()=>location.href='apply.html?job='+encodeURIComponent(j.title)+'&company='+encodeURIComponent(j.company);favBtn.onclick=()=>{favBtn.textContent='★ お気に入り保存済み';localStorage.setItem('efaceFav',j.id)};
</script></body></html>
